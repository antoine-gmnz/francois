[package]
name = "francois"
version = "0.24.0"
description = "Francois — Claude Code session orchestrator (preview)"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: session-attachments FR-12 renders a staged image chip's
# thumbnail straight off disk via `convertFileSrc` → `asset://`. The scheme
# handler is compiled in ONLY behind this feature (tauri.conf.json's
# `assetProtocol.enable` alone does not register it), and it serves nothing that
# `session::attachments::asset_scope` has not explicitly allowed.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map is a BTreeMap by default, so every surgical
# write of a user's settings.json would alphabetically REORDER all of its keys.
# permission-guardrails FR-14 promises to preserve what it does not touch, and a
# three-writer, hand-maintained file being reshuffled on the first "always allow"
# breaks that promise. Also stabilizes sessions.json and the transcript writes.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
# multi-provider-openai FR-14: the Francois agent loop's `Grep` tool carries
# Claude Code's own tool name, so it must accept the regex syntax Claude
# Code's Grep accepts rather than only literal substrings.
regex = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
notify = "6"
# session-attachments FR-6: `pasted-<YYYYMMDD>-<HHMMSS>` is stamped in LOCAL time,
# which std cannot produce (no timezone database). `clock` is the only feature used.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# session-attachments: the clipboard image arrives as base64 over the IPC bridge.
base64 = "0.22"
# extension-install FR-18: the sha256 of a manifest's bytes, so consent can be
# bound to its content and a later edit reverts the extension to disabled.
sha2 = "0.10"
# multi-provider-grok FR-25: the model catalog lives in $GROK_HOME/config.toml
# ([models]/[model.<id>] tables) — the vendor's own format, not JSON, and no
# dependency already in this tree parses TOML.
toml = "0.8"

# self-update FR-15: the relauncher is spawned DETACHED so it outlives the app.
# On unix that means `setsid()` in a pre_exec hook — there is no std API for it,
# and the `setsid(1)` binary does not exist on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
lto = true
