[package]
name = "francois"
version = "0.35.1"
description = "Francois — Claude Code session orchestrator (preview)"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: session-attachments FR-12 renders a staged image chip's
# thumbnail straight off disk via `convertFileSrc` → `asset://`. The scheme
# handler is compiled in ONLY behind this feature (tauri.conf.json's
# `assetProtocol.enable` alone does not register it), and it serves nothing that
# `session::attachments::asset_scope` has not explicitly allowed.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map is a BTreeMap by default, so every surgical
# write of a user's settings.json would alphabetically REORDER all of its keys.
# permission-guardrails FR-14 promises to preserve what it does not touch, and a
# three-writer, hand-maintained file being reshuffled on the first "always allow"
# breaks that promise. Also stabilizes sessions.json and the transcript writes.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
# multi-provider-openai FR-14: the Francois agent loop's `Grep` tool carries
# Claude Code's own tool name, so it must accept the regex syntax Claude
# Code's Grep accepts rather than only literal substrings.
regex = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }
notify = "8"
# session-attachments FR-6: `pasted-<YYYYMMDD>-<HHMMSS>` is stamped in LOCAL time,
# which std cannot produce (no timezone database). `clock` is the only feature used.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# session-attachments: the clipboard image arrives as base64 over the IPC bridge.
base64 = "0.22"
# extension-install FR-18: the sha256 of a manifest's bytes, so consent can be
# bound to its content and a later edit reverts the extension to disabled.
sha2 = "0.10"
# multi-provider-grok FR-25: the model catalog lives in $GROK_HOME/config.toml
# ([models]/[model.<id>] tables) — the vendor's own format, not JSON, and no
# dependency already in this tree parses TOML.
toml = "1.1"

# self-update FR-15: the relauncher is spawned DETACHED so it outlives the app.
# On unix that means `setsid()` in a pre_exec hook — there is no std API for it,
# and the `setsid(1)` binary does not exist on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
lto = true

# ── lint policy ─────────────────────────────────────────────────────────────
# Owned HERE rather than as `cargo clippy -- -D warnings` in CI, deliberately:
# flags after `--` are appended LAST, so `-D warnings` would silently re-deny
# every exception below. Cargo's `priority` solves it properly — the group is
# evaluated first (priority -1), the named exceptions afterwards (priority 0) —
# and it means `cargo clippy` behaves identically on a laptop and on CI.
#
# Every `allow` here is a deliberate exception with a reason, not a mute button.
# Anything not listed is denied, so a new warning fails the build.
[lints.rust]
unused_imports = "deny"
unused_must_use = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# Doc-comment markdown nits (indentation of wrapped list items). This is a
# binary crate that publishes no rustdoc, and its doc comments are hand-wrapped
# prose carrying design rationale — reflowing them to satisfy a markdown parser
# nobody runs would cost readability and buy nothing.
doc_lazy_continuation = "allow"

# 3 sites, all boundary signatures (diff/git.rs, permissions/commands.rs,
# session/turn.rs). The types are shaped by the contract; naming each one adds
# an indirection at the exact place a reader most wants the shape spelled out.
type_complexity = "allow"

# 2 sites: `session/commands/lifecycle.rs` spawn (15 args) and
# `session/stream/blocks.rs` (8). Both are single-caller entry points whose
# arguments are the session's spawn parameters — bundling them into a struct is
# a worthwhile refactor, but a behavioural one, not a lint fix.
too_many_arguments = "allow"

# `SessionEvent` and `InteractiveMsg` are ≥640 bytes because one variant carries
# a full transcript block. Boxing that variant is a REAL improvement — it is on
# the backlog — but it touches every construction and match site in the stream
# path, so it does not belong in a tooling change.
large_enum_variant = "allow"

# `extensions::Stream*` variants share their prefix on purpose: the prefix is
# what marks them as the streaming sub-protocol.
enum_variant_names = "allow"
