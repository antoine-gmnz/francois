<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Francois app mark (design 6c). Near-black tile — "a bright tile in a
       taskbar is a distraction; a bright mark on a dark tile is a status
       light" — with a 1px inset border, and the three-slab mark centred at
       54.8% of the tile height, drawn from the same offset-parallelogram
       formula as src/ui/Logo.tsx (clip-path: polygon(28% 0%, 100% 0%, 72%
       100%, 0% 100%)). Top two slabs take the live colour, the bottom slab
       stays dim — it is the idle session, not a shadow. -->
  <rect x="0" y="0" width="512" height="512" rx="108.31" fill="#12160e" />
  <rect
    x="2.46" y="2.46" width="507.08" height="507.08" rx="105.85"
    fill="none" stroke="#2a3320" stroke-width="4.92"
  />
  <polygon fill="#c3f53f" points="228.5,115.71 410.32,115.71 339.61,192.87 157.8,192.87" />
  <polygon fill="#c3f53f" points="200.45,217.42 382.26,217.42 311.55,294.58 129.74,294.58" />
  <polygon fill="#5f7a1e" points="172.39,319.13 354.2,319.13 283.5,396.29 101.68,396.29" />
</svg>
