name: npm-publish

# Publish the `francois` npm package (packaging/npm) against an existing GitHub
# release. The package itself carries no binaries: its postinstall downloads the
# portable archives attached to `tag` and verifies them against the sha256 digests
# this job bakes into manifest.json.
#
# Always dispatched, never triggered by a release event: release.yml calls it as
# the last step of every push to main, and waits for the result. Re-run a publish
# by hand with
#
#     gh workflow run npm-publish.yml -f tag=v0.15.0
#
# The tag must point at a PUBLISHED (non-draft) release — assets on a draft are not
# publicly downloadable, so a package pointing at one would install nothing.
# release.yml un-drafts before it dispatches.
#
# Credentials: npm trusted publishing (OIDC) only — no token, no stored secret.
# npm authenticates against the job's short-lived id-token, which requires a
# trusted publisher registered on npmjs.com for the `francois` package with
# EXACTLY these coordinates:
#
#     Publisher    GitHub Actions
#     Repository   antoine-gmnz/francois
#     Workflow     npm-publish.yml
#     Environment  npm-publish
#
# Those four must match the OIDC claims or the token exchange is refused.
#
# NOTE: this workflow is deliberately NOT reusable (no workflow_call). npm's
# exchange validates the workflow the job actually runs as, and a `uses:` call
# produces different claims from a direct trigger. release.yml therefore
# dispatches this workflow rather than calling it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from (e.g. v0.15.0).
        required: true
        type: string

permissions:
  contents: read # download the release assets
  id-token: write # OIDC: npm trusted publishing + the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    # Part of the trusted-publisher identity: this name is one of the OIDC claims
    # npm checks, so it must match what is registered on npmjs.com exactly.
    environment: npm-publish
    steps:
      # The tag is the source of truth for the version: release.yml wrote it into
      # the manifests in the commit the tag points at.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 already bundles npm 11+;
      # take the latest anyway (npm 12 requires Node >= 22, hence 24 above).
      - name: Ensure npm >= 11.5 for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      # The app version is the source of truth for both the npm version and the
      # string `francois --version` prints. It must agree with the tag, or the
      # package would advertise a version whose binaries are something else.
      - name: Read + check the package version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$app" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $app"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "product=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_OUTPUT"

      # Downloading the assets is what pins the package to real bytes: the digests
      # below are of the exact files a user's postinstall will fetch.
      - name: Build manifest.json from the release assets
        working-directory: packaging/npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          PRODUCT_NAME: ${{ steps.version.outputs.product }}
        run: |
          set -euo pipefail
          mkdir -p .assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .assets \
            --pattern 'francois-darwin-universal.tar.gz' \
            --pattern 'francois-linux-x64.tar.gz' \
            --pattern 'francois-win32-x64.zip'

          entry() { echo "\"$1\": { \"name\": \"$2\", \"sha256\": \"$(sha256sum ".assets/$2" | cut -d' ' -f1)\" }"; }
          cat > manifest.json <<EOF
          {
            "repo": "$GITHUB_REPOSITORY",
            "tag": "$TAG",
            "channel": "stable",
            "appVersion": "$APP_VERSION",
            "productName": "$PRODUCT_NAME",
            "assets": {
              $(entry darwin-universal francois-darwin-universal.tar.gz),
              $(entry linux-x64 francois-linux-x64.tar.gz),
              $(entry win32-x64 francois-win32-x64.zip)
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          rm -rf .assets
          cat manifest.json

      # Smoke test on the runner itself: a real download + checksum + unpack, so a
      # broken manifest fails here instead of on a user's machine.
      - name: Verify the postinstall against the real release
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          node install.js
          test -x "$(node -e "process.stdout.write(require('./lib/platform.js').resolveExecutable() || '')")"
          rm -rf vendor

      # No token and no auth setup of any kind: npm negotiates the credential
      # itself from the job's id-token. Anything written to npm's auth config
      # here would stop it short of the OIDC exchange.
      - name: Publish to npm
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          echo "publishing over OIDC (trusted publishing)"

          # The exact claims npm matches against the registered trusted publisher.
          # A refused exchange says nothing about WHICH field disagreed, so print
          # them: every one is public repository metadata. The token itself is a
          # credential and is never echoed.
          claims=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" 2>/dev/null \
            | node -e '
              let raw = ""; process.stdin.on("data", d => raw += d).on("end", () => {
                const jwt = JSON.parse(raw).value;
                const p = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString());
                for (const k of ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref"])
                  console.log("  " + k + ": " + (p[k] ?? "(absent)"));
              });
            ' 2>/dev/null) || true
          echo "${claims:-  (could not read id-token claims)}"

          npm version "${{ steps.version.outputs.app }}" --no-git-tag-version --allow-same-version

          # --provenance signs a build attestation with the job's id-token, so anyone
          # can verify this tarball was built by this workflow from this commit.
          #
          # Verbose output goes to a file rather than the log: on success the summary
          # is all anyone wants, but on failure npm reports a refused OIDC exchange as
          # a bare "ENEEDAUTH ... run npm adduser", which is actively misleading in CI.
          # The real reason (publisher not configured, claims mismatch) only appears at
          # verbose level. Filtered to auth lines so no token text is ever echoed.
          set +e
          npm publish --access public --provenance --tag latest \
            --loglevel verbose > publish.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            grep -E "^\+ |Signed provenance|Provenance statement" publish.log || true
          else
            echo "::error::npm publish failed — authentication diagnostics follow"
            grep -iE "oidc|trusted|exchange|ENEEDAUTH|need auth|E40[13]" publish.log | head -20 || true
          fi
          rm -f publish.log
          exit $status
