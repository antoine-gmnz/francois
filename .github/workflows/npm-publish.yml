name: npm-publish

# Publish the `francois` npm package (packaging/npm) against an existing GitHub
# release. The package itself carries no binaries: its postinstall downloads the
# portable archives attached to `tag` and verifies them against the sha256 digests
# this job bakes into manifest.json.
#
# Two entry points:
#   - called by release-main.yml after the dev matrix finishes  → 0.9.0-dev.<run>, dist-tag `dev`
#   - a versioned release being *published* (a v* draft going live) → 0.9.0, dist-tag `latest`
#
# The stable path deliberately waits for `release: published` rather than running
# inside release.yml: that workflow creates a DRAFT, and assets on a draft are not
# publicly downloadable — an npm package pointing at one would install nothing.
#
# Credentials — two supported modes, in order of preference:
#   1. npm trusted publishing (OIDC). Configure this repo + workflow as a trusted
#      publisher on npmjs.com and there is NO stored credential at all; npm
#      authenticates against the job's short-lived id-token. Leave NPM_TOKEN unset.
#   2. An NPM_TOKEN secret (npm automation token, publish rights). Bootstrap mode —
#      needed for the very first publish, since a trusted publisher can only be
#      attached to a package that already exists.
#
# The token is deliberately NOT inherited: callers pass NPM_TOKEN and nothing else,
# it is scoped to the `npm` environment, and it is exposed to the single publish
# step rather than to the job.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag holding the portable archives.
        required: true
        type: string
      channel:
        description: '"dev" (prerelease, dist-tag dev) or "stable" (dist-tag latest).'
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: npm automation token. Omit entirely when using trusted publishing.
        required: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from (e.g. v0.9.0).
        required: true
        type: string
      channel:
        description: dev | stable
        required: true
        default: stable
        type: string

permissions:
  contents: read # download the release assets
  id-token: write # OIDC: npm trusted publishing + the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scopes the publish credential: NPM_TOKEN can live as an environment secret
    # (optionally behind required reviewers or a branch rule) instead of being
    # readable by every workflow in the repo. Auto-created on first run.
    environment: npm
    # The rolling dev release is deleted and recreated on every push to main, which
    # fires `release: published` — but release-main.yml already calls this workflow
    # once the archives are attached, so ignore the event for that tag.
    if: github.event_name != 'release' || github.event.release.tag_name != 'dev'
    steps:
      - name: Resolve the release tag + channel
        id: target
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          channel="${{ inputs.channel || (github.event.release.prerelease && 'dev' || 'stable') }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          # The rolling dev tag is not a checkout target — take the commit that
          # triggered the build so the version read below matches the binaries.
          echo "ref=$([ "$tag" = dev ] && echo "$GITHUB_SHA" || echo "$tag")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      # Deliberately NO registry-url: that makes setup-node write an .npmrc
      # pinning `_authToken=${NODE_AUTH_TOKEN}` and point NPM_CONFIG_USERCONFIG
      # at it. With no token the entry resolves to empty, npm treats the registry
      # as "auth configured but unusable", fails with ENEEDAUTH and never attempts
      # the OIDC exchange. The publish step below configures auth itself instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Node 20 ships npm 10; trusted publishing (OIDC) landed in npm 11.5.1.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@^11
          echo "npm $(npm --version)"

      # The app version is the source of truth for both the npm version and the
      # string `francois --version` prints.
      - name: Compute the package version
        id: version
        run: |
          set -euo pipefail
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "app=$app" >> "$GITHUB_OUTPUT"
          # The dev overlay renames the app, and the desktop integration names the
          # Start Menu / Launchpad entry after it — so read it from the same config
          # the build used rather than hardcoding it.
          if [ "${{ steps.target.outputs.channel }}" = dev ]; then
            echo "product=$(node -p "require('./src-tauri/tauri.dev.conf.json').productName")" >> "$GITHUB_OUTPUT"
          else
            echo "product=$(node -p "require('./src-tauri/tauri.conf.json').productName")" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.target.outputs.channel }}" = dev ]; then
            # run_number is monotonic, so every push to main gets a fresh, ordered
            # prerelease version — npm refuses to republish an existing one.
            echo "npm=$app-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "disttag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "npm=$app" >> "$GITHUB_OUTPUT"
            echo "disttag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Downloading the assets is what pins the package to real bytes: the digests
      # below are of the exact files a user's postinstall will fetch.
      - name: Build manifest.json from the release assets
        working-directory: packaging/npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          CHANNEL: ${{ steps.target.outputs.channel }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          PRODUCT_NAME: ${{ steps.version.outputs.product }}
        run: |
          set -euo pipefail
          mkdir -p .assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .assets \
            --pattern 'francois-darwin-universal.tar.gz' \
            --pattern 'francois-linux-x64.tar.gz' \
            --pattern 'francois-win32-x64.zip'

          entry() { echo "\"$1\": { \"name\": \"$2\", \"sha256\": \"$(sha256sum ".assets/$2" | cut -d' ' -f1)\" }"; }
          cat > manifest.json <<EOF
          {
            "repo": "$GITHUB_REPOSITORY",
            "tag": "$TAG",
            "channel": "$CHANNEL",
            "appVersion": "$APP_VERSION",
            "productName": "$PRODUCT_NAME",
            "assets": {
              $(entry darwin-universal francois-darwin-universal.tar.gz),
              $(entry linux-x64 francois-linux-x64.tar.gz),
              $(entry win32-x64 francois-win32-x64.zip)
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          rm -rf .assets
          cat manifest.json

      # Smoke test on the runner itself: a real download + checksum + unpack, so a
      # broken manifest fails here instead of on a user's machine.
      - name: Verify the postinstall against the real release
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          node install.js
          test -x "$(node -e "process.stdout.write(require('./lib/platform.js').resolveExecutable() || '')")"
          rm -rf vendor

      # The credential is bound to this one step, not to the job, so nothing else —
      # including the release download and the postinstall smoke test above — ever
      # has it in its environment. Empty means "authenticate over OIDC instead".
      - name: Publish to npm
        working-directory: packaging/npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            # Bootstrap mode. Written here rather than by setup-node so that the
            # no-token case leaves npm's auth config completely untouched.
            echo "authenticating with the NPM_TOKEN secret"
            npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
          else
            echo "no NPM_TOKEN — authenticating over OIDC (trusted publishing)"
            # TEMPORARY diagnostic: npm swallows OIDC-exchange failures at the
            # default log level and reports a bare ENEEDAUTH. Print only whether
            # the id-token vars exist — never their values.
            echo "  id-token URL:   $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo present || echo MISSING)"
            echo "  id-token TOKEN: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] && echo present || echo MISSING)"
            echo "  npm: $(npm --version)"
          fi
          npm version "${{ steps.version.outputs.npm }}" --no-git-tag-version --allow-same-version
          # --provenance signs a build attestation with the job's id-token, so anyone
          # can verify this tarball was built by this workflow from this commit.
          # TEMPORARY: surface the OIDC-exchange failure npm hides at default
          # verbosity. Only oidc/auth-related lines are echoed, so no token text
          # from the verbose stream reaches the log.
          set +e
          npm publish --access public --provenance --tag "${{ steps.version.outputs.disttag }}" \
            --loglevel verbose > /tmp/publish.log 2>&1
          status=$?
          set -e
          grep -iE "oidc|trusted|exchange|audience|id.token|ENEEDAUTH|403|401" /tmp/publish.log | head -30 || true
          exit $status
